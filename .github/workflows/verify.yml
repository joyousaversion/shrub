name: Verify shrub

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        # actions/checkout v7.0.1: https://github.com/actions/checkout/releases/tag/v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential libncurses-dev emacs-bin-common
      - name: Build terminal game
        run: make
      - name: Run C regressions
        run: make test
      - name: Run AddressSanitizer and UndefinedBehaviorSanitizer
        run: make test-sanitize
      - name: Smoke test terminal game
        run: make test-smoke
