# Nool configuration
#
# Generated by `nool init` — every [section] below is a live NoolConfig
# default that Nool reads on each run. This header documents what each one
# configures and how to tune it; the values underneath are the actual config.
#
#   [aram]        WASM Airlock validation gates: policy script paths, fuel/
#                 memory limits for the sandbox, strict-float rejection, and
#                 lifecycle hooks. e.g. policies_path = "policies/"
#   [bridge]      Bifrost transport: where the mirror lives, whether solidify
#                 auto-syncs, extra remotes to auto-push, and which transport
#                 backend to use.  transport = "git" (default) or "pijul".
#                 e.g. sync_on_solidify = true, auto_push_remotes = ["origin"]
#   [replay]      Canonical replay engine: max_clock_skew_ms rejects Knots
#                 whose HLC timestamp drifts too far into the future (default
#                 5000ms); strict_causality enforces parent-before-child order.
#   [memory]      LanceDB intent index: similarity_threshold for "similar work"
#                 discovery (0.0-1.0) and which embedding_model to use.
#   [webhooks]    notify_on_solidify = true posts an event to configured hooks
#                 whenever a Knot lands — wire up CI/chat integrations here.
#   [reification] Speculative reification in the shadow worktree: whether to
#                 run_ghost_tests / cascade_reification / use_cow_acceleration,
#                 and [reification.dependencies] cross-language hints, e.g.
#                 proto = ["ts", "ex"] to re-validate generated bindings.
#   [workflow]    Workflow automation triggers (empty by default) — see
#                 `nool guide agent` for how to wire task/release hooks here.
#   [[languages]] Custom or plugin-based Language Adapters beyond the built-ins
#                 — each entry needs name/extensions/comment_prefixes (and a
#                 WASM plugin path for plugin-based adapters).
#   [billing]     License/subscription state — managed by Nool; avoid hand-
#                 editing license_key/license_expiry_hlc.
#   [features]    Top-level feature flags, e.g. team_collaboration,
#                 peer_to_peer, task_management — flip to `false` to disable.
#   [cli]         CLI defaults: current_thread / persona pre-selection.
#   [invariants]  Relational Invariants: `rules = ["requires_doc", ...]` plus
#                 [invariants.rule_definitions.<id>] for custom rule bodies. Live
#                 by default (built-in controls run when `rules` is empty); set
#                 `disabled = true` to opt out — verify/audit then fail closed
#                 (inconclusive, non-zero exit) rather than vacuously passing.
#   [blast_radius]  [blast_radius.trust_levels] maps paths/globs to trust
#                 tiers used when scoring downstream impact.
#   [doctor]      Release-readiness gate: release_branch_patterns (glob list)
#                 and whether a release marker is expected on those branches.
#   [gating]      Aram gate failure policy: fail_fast, what a WASM policy
#                 failure does (wasm_policy_failure = "block" | "warn"), and
#                 [gating.fail_fast_per_stage] per-stage overrides.
#   [trust]       Dynamic progressive trust (off by default): base_trust,
#                 escalation_per_clean/decay_on_failure adjust a per-agent
#                 trust score from its clean-solidify streak; once it clears
#                 auto_proceed_threshold at or below auto_proceed_max_blast,
#                 the steering prompt is skipped. See `nool guide governance`.
#   [steer]       Role-based steering checkpoints (pre-solidify, pre-push,
#                 doctor, goal-complete, ...): enabled + [[steer.points]]
#                 bind a checkpoint to a role/specialist and its triggers.
#                 Resolve one with `nool steer --point <p> --role <r>
#                 --action <a>`. See `nool guide governance`.
#   [tasks.acceptance_criteria]  Task acceptance-criteria projection: whether
#                 reviews are requested (review = "off" | "requested"), and
#                 which engineering defaults (TDD, minimal scope, ...) to seed.
#   [threads]     Intent-thread hygiene: auto_archive_idle_days archives
#                 unresolved threads after the configured idle window; 0
#                 disables automatic archival.
#   [telemetry.pricing_overrides]  Per-model USD/M-token overrides for cost
#                 reports, e.g. [telemetry.pricing_overrides."my-model"] with
#                 input_cost_per_million_tokens / output_cost_per_million_tokens
#                 — use this to reflect negotiated rates or unlisted models.
#
# Tip: run `nool config --help` to inspect/edit individual values from the CLI,
# and `nool doctor --strict` to validate the repo against this configuration.

languages = []

[aram]
policies_path = "policies/"
fuel_limit = 1000000000
memory_limit = 16777216
strict_floats = true
require_full_paths = []
hooks = []

[bridge]
git_mirror_path = ".nool/git_mirror/"
sync_on_solidify = true
auto_push_remotes = []
use_host_repo = true
transport = "git"
max_push_blob_bytes = 104857600

[commit]

[replay]
max_clock_skew_ms = 5000
strict_causality = true

[memory]
similarity_threshold = 0.699999988079071
embedding_model = "local"

[webhooks]
notify_on_solidify = false

[reification]
enabled = true
run_ghost_tests = true
cascade_reification = true
use_cow_acceleration = true
test_selection = true
max_selected_ratio = 0.4000000059604645

[reification.dependencies]
proto = [
    "ts",
    "ex",
]

[analysis]
ast_enabled = true
generated_paths = [
    "*.min.js",
    "*.min.css",
    "assets/",
    "vendor/",
    "node_modules/",
    "target/",
    "dist/",
    "*.lock",
]
field_signal = false

[workflow]

[try]
mode = "shared"
max_worktrees = 64
lease_ttl_ms = 1800000

[fleet]
width = "auto"
reserved_cpus = 2
memory_per_agent_mb = 512
min_width = 1
max_width = 16
launch_stagger_ms = 250
provider_requests_per_minute = 0
provider_tokens_per_minute = 0
agent_requests_per_minute = 45
agent_tokens_per_minute = 45000

[billing]
soft_limit_threshold_percent = 110
sync_online = true

[daemon]
idle_timeout_secs = 1800
max_registered_repos = 128
ipc_semaphore_permits = 0
fetch_interval_secs = 60

[features]
team_collaboration = true
peer_to_peer = true
task_management = true
auto_announce = true
mcp_progressive_tools = false

[cli]

[invariants]
disabled = false
rules = []

[invariants.rule_definitions]

[blast_radius.trust_levels]

[doctor]
release_branch_patterns = [
    "release/*",
    "hotfix/*",
]
expect_release_on_release_branch = true
stale_task_days = 21

[gating]
fail_fast = true
relational_controls = "warn"
wasm_policy_failure = "block"
blast_block_threshold = 30
judgment_blocking = false
judgment_tools = []
judgment_budget_usd = 0.1
judgment_escalation_blocking = false
judgment_escalation_role = "tech-lead"
judgment_escalation_dir = ".nool/judgment-review"
judgment_retain_days = 90
judgment_backlog_limit = 25
max_knot_bytes = 67108864

[gating.fail_fast_per_stage]

[rules]
forbidden_paths = []

[tasks.acceptance_criteria]
review = "off"
engineering_defaults = true
require_no_placeholders = true
prefer_tdd = true
prefer_boundary_preservation = true
prefer_minimal_scope = true

[tasks.lifecycle]
states = []
transitions = []

[telemetry.pricing_overrides]

[telemetry.otel]
enabled = false
endpoint = "http://127.0.0.1:4318/v1/traces"
service_name = "nool"

[telemetry.otel.headers]

[analytics]
enabled = true
notice_shown = false
commands_since_last_survey = 0

[threads]
auto_archive_idle_days = 30

[models]
default = "host"
host_detection_failure = "warn"

[models.catalog]

[lifecycle]

[consortium]

[soul]

[eval_set]

[routing]

[trust]
enabled = false
base_trust = 0.5
escalation_per_clean = 0.05000000074505806
decay_on_failure = 0.20000000298023224
auto_proceed_threshold = 0.800000011920929
auto_proceed_max_blast = 10

[attestation]
checker_keys = []
reviewer_keys = []
mint_on_solidify = true
dependents_wait_for = "done"
enforce = "warn"
accept_selected = []

[attestation.obligations]

[coordination]
backend = "local"
remote = "origin"
confirm_after_ms = 15000
seal_requires_authority = false
hub_repo = "default"
hub_token_env = "NOOL_HUB_TOKEN"
hub_timeout_ms = 5000

[knowledge]
replicate = "verdicts"

[steer]
enabled = false
points = []
high_risk_roles = [
    "architect",
    "ciso",
    "cto",
]
high_risk_points = [
    "pre-push",
    "goal-complete",
    "doctor",
]

[integrations]
push_back_comments = false

[playbook]

[tools.mcp]

[tools.fs]
allowed_roots = []
max_bytes = 1048576

[tools.shell]
allowed_commands = []
timeout_secs = 30
max_output_bytes = 65536

[harness.sandbox]
write_paths = ["."]
net_egress = "deny"

[relations]
allow_low_confidence = false

[code]
default_model = "anthropic/claude-sonnet-5"
default_backend = "openrouter"
default_mode = "suggest"
budget_usd = 2.0
max_rounds = 40
idle_exit_minutes = 30
max_concurrent_sessions = 3
retry_attempts = 3

[code.models]
